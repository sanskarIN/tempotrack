version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # gradle/actions v6 bundles a separately licensed proprietary caching component.
      # Keep receiving later update proposals while intentionally skipping only v6.x.
      - dependency-name: "gradle/actions"
        versions: ["6.x"]
