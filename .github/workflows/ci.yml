name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Verify shared and desktop
        run: gradle :shared:ktlintCheck :desktopApp:ktlintCheck :shared:allTests :desktopApp:test :desktopApp:compileKotlin --stacktrace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Test, lint and build Android
        run: gradle :androidApp:ktlintCheck :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --stacktrace

  ios-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Compile iOS simulator framework
        run: gradle :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Test iOS simulator target
        run: gradle :shared:iosSimulatorArm64Test --stacktrace

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile repository tooling
        run: >-
          python -m py_compile
          tools/check_gradle_version_alignment.py
          tools/check_markdown_links.py
          tools/check_kotlin_package_keywords.py
          tools/check_repository_reference.py
      - name: Validate release metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties)"
          VERSION_CODE="$(sed -n 's/^appVersionCode=//p' gradle.properties)"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "gradle.properties appVersion must be canonical MAJOR.MINOR.PATCH without leading zeros." >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( ${#MAJOR} > 6 || ${#MINOR} > 2 || ${#PATCH} > 2 )); then
            echo "Application version components are too large for the Android versionCode mapping." >&2
            exit 1
          fi

          EXPECTED_VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if [[ "$VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "appVersionCode=$VERSION_CODE does not match appVersion=$VERSION; expected $EXPECTED_VERSION_CODE." >&2
            exit 1
          fi

          grep -Fq "Current release line: **$VERSION**" README.md
          grep -Fq "## [$VERSION]" CHANGELOG.md
          grep -Fq "## $VERSION —" ROADMAP.md
      - name: Validate Gradle version alignment
        run: python tools/check_gradle_version_alignment.py
      - name: Validate Kotlin package keyword escaping
        run: python tools/check_kotlin_package_keywords.py
      - name: Validate tracked file documentation coverage
        run: python tools/check_repository_reference.py
      - name: Validate local Markdown links
        run: python tools/check_markdown_links.py
