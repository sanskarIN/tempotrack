name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and build Android release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER" \
            :shared:allTests \
            :androidApp:lintRelease \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleRelease \
            --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-android-release-unsigned
          path: androidApp/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and package desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:allTests \
            :desktopApp:packageDistributionForCurrentOS \
            --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/**

  ios-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and link iOS framework
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:iosSimulatorArm64Test \
            :shared:linkReleaseFrameworkIosArm64 \
            --stacktrace
      - name: Archive iOS framework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            shared/build/bin/iosArm64/releaseFramework/TempoTrackShared.framework \
            tempotrack-ios-arm64-framework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-ios-arm64-framework
          path: tempotrack-ios-arm64-framework.zip
