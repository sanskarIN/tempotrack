name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and build Android release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER" \
            :shared:allTests \
            :androidApp:lintRelease \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleRelease \
            --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-android-release-unsigned
          path: androidApp/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and package desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:allTests \
            :desktopApp:packageDistributionForCurrentOS \
            --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/**

  ios-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify and link iOS framework
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:iosSimulatorArm64Test \
            :shared:linkReleaseFrameworkIosArm64 \
            --stacktrace
      - name: Archive iOS framework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            shared/build/bin/iosArm64/releaseFramework/TempoTrackShared.framework \
            tempotrack-ios-arm64-framework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tempotrack-ios-arm64-framework
          path: tempotrack-ios-arm64-framework.zip

  publish:
    needs: [android, desktop, ios-framework]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done < <(
            find artifacts -type f \
              \( -name '*.apk' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.zip' \) \
              -print0
          )
          test "$(find release-assets -type f | wc -l)" -gt 0
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "TempoTrack $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
