name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag and Android version code
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use canonical vMAJOR.MINOR.PATCH without leading zeros, for example v2.0.12." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if (( ${#MAJOR} > 6 || ${#MINOR} > 2 || ${#PATCH} > 2 )); then
            echo "Release version components are too large for the Android versionCode mapping." >&2
            exit 1
          fi

          MAJOR_DEC=$((10#$MAJOR))
          MINOR_DEC=$((10#$MINOR))
          PATCH_DEC=$((10#$PATCH))

          if (( MINOR_DEC > 99 || PATCH_DEC > 99 )); then
            echo "Android release mapping requires MINOR and PATCH to be between 0 and 99." >&2
            exit 1
          fi

          VERSION_CODE=$((MAJOR_DEC * 10000 + MINOR_DEC * 100 + PATCH_DEC))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Derived Android versionCode $VERSION_CODE is outside the supported 1..2100000000 range." >&2
            exit 1
          fi

          echo "Validated $GITHUB_REF_NAME -> Android versionCode $VERSION_CODE"

  android:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Prepare Android signing material
        shell: bash
        env:
          TEMPOTRACK_KEYSTORE_BASE64: ${{ secrets.TEMPOTRACK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${TEMPOTRACK_KEYSTORE_BASE64:?Configure TEMPOTRACK_KEYSTORE_BASE64 as a GitHub Actions secret}"
          KEYSTORE_PATH="$RUNNER_TEMP/tempotrack-release.jks"
          printf '%s' "$TEMPOTRACK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "TEMPOTRACK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Verify and build signed Android release
        shell: bash
        env:
          TEMPOTRACK_KEYSTORE_PASSWORD: ${{ secrets.TEMPOTRACK_KEYSTORE_PASSWORD }}
          TEMPOTRACK_KEY_ALIAS: ${{ secrets.TEMPOTRACK_KEY_ALIAS }}
          TEMPOTRACK_KEY_PASSWORD: ${{ secrets.TEMPOTRACK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TEMPOTRACK_KEYSTORE_PASSWORD:?Configure TEMPOTRACK_KEYSTORE_PASSWORD as a GitHub Actions secret}"
          : "${TEMPOTRACK_KEY_ALIAS:?Configure TEMPOTRACK_KEY_ALIAS as a GitHub Actions secret}"
          : "${TEMPOTRACK_KEY_PASSWORD:?Configure TEMPOTRACK_KEY_PASSWORD as a GitHub Actions secret}"

          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          gradle \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            :shared:allTests \
            :androidApp:lintRelease \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleRelease \
            :androidApp:bundleRelease \
            --stacktrace
      - name: Verify signed Android outputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find androidApp/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$(find androidApp/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: tempotrack-android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab

  desktop:
    needs: validate-tag
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Verify and package desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:allTests \
            :desktopApp:packageDistributionForCurrentOS \
            --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: tempotrack-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/**

  ios-framework:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Verify and link iOS framework
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle \
            -PappVersion="$VERSION" \
            :shared:iosSimulatorArm64Test \
            :shared:linkReleaseFrameworkIosArm64 \
            --stacktrace
      - name: Archive iOS framework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            shared/build/bin/iosArm64/releaseFramework/TempoTrackShared.framework \
            tempotrack-ios-arm64-framework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: tempotrack-ios-arm64-framework
          path: tempotrack-ios-arm64-framework.zip

  publish:
    needs: [android, desktop, ios-framework]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done < <(
            find artifacts -type f \
              \( -name '*.apk' -o -name '*.aab' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.zip' \) \
              -print0
          )
          test "$(find release-assets -type f | wc -l)" -gt 0
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "TempoTrack $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber