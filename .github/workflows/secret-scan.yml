name: Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository text for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' -- . ':!docs/*' ':!*.md'; then
            echo "Potential secret material detected."
            exit 1
          fi
          echo "No common committed secret patterns detected."
